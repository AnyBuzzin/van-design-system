[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vandesign"
dynamic = ["version"]
description = "CAD-neutral engineering core for modular van designs"
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "vandesign.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
