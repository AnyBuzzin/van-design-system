name: Engineering bug
description: File an actionable CAD or Python engineering issue
title: "[BUG] "
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected dimensions and behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behaviour and failure report
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce, Fusion version and parameter values
    validations:
      required: true
