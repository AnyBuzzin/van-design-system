name: Fusion verification
description: Record a repeatable Fusion geometry smoke test
title: "[FUSION TEST] "
body:
  - type: textarea
    id: build
    attributes:
      label: Script revision, Fusion version, design and parameter configuration
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: PASS/FAIL/UNKNOWN results and screenshots
    validations:
      required: true
